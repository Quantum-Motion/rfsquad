[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "rfsquad"
version = "0.0.0"
description = "A Simulator of Quantum Dot Devices measured in RF"
authors = [
    "Tara Murphy <tm763@cam.ac.uk>",
    "Katarina Brlec <katarina@quantummotion.tech>",
]
readme = "README.md"
# license = {text = "MIT License"}

[tool.poetry.dependencies]
python = ">=3.11, <3.13"
matplotlib = "^3.5.2"
numpy = "^1.21.0"
pandas = "^2.0"

jax = ">=0.5.0"
jaxlib = ">=0.5.0"
jaxopt = "^0.8.3"
jupyter = "^1.0.0"
pytest = "^8.0.0"
pytest-cov = "^3.0.0"
tabulate = "^0.8.0"
tomli-w = "^1.0.0"
prettytable = "^3.10.0"
rich = "^13.7.1"
networkx = "3.3"
gravis = "0.1.0"
h5py = "^3.11.0"
setuptools = "81.0.0"

[tool.poetry.group.dev.dependencies]
pylint = "^2.15.5"
ipykernel = "^6.17.1"
black = "^22.10.0"
snakeviz = "^2.1.1"
ruff = "^0.7.0"
pre-commit = ">=4.0.1"

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --no-cov-on-fail"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"

[tool.mypy]
ignore_missing_imports = true
[tool.ruff]
output-format = "concise"
